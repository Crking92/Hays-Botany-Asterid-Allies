name: Inspect exact PlantNet GBIF media-license/version provenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-plantnet-gbif-rights.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_plantnet_gbif_license.py
