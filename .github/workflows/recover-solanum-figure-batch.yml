name: Recover 7 licensed Solanum research photographs from historical archives
# Diagnose previously unreported gallery attribution assertion before publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-solanum-figure-batch.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: hays-Hays-Botany-Asterid-Allies-photo-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Access preserved historical source branch
        run: |
          git fetch origin staging/original-source-transfer
          git worktree add "$RUNNER_TEMP/archive" origin/staging/original-source-transfer
      - name: Install exact-source seven-image batch and validate all public photo records
        run: |
          python3 -m py_compile scripts/recover_solanum_phytokeys_figure_batch.py
          python3 scripts/recover_solanum_phytokeys_figure_batch.py "$RUNNER_TEMP/archive"
          python3 scripts/build_collection_preview.py
          git diff --check
      - name: Publish one complete conflict-safe photo/card/index commit
        id: save
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/media/solanum-emulans site/media/solanum-interius site/data/species/solanum-emulans.json site/data/species/solanum-interius.json site/data/gallery-index.json site/data/collection-index.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Concurrent publisher updated family repo; refusing stale commit" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Publish seven historically archived CC BY 4.0 Solanum identification photos'
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Request public Pages rebuild
        if: steps.save.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Check exact live photo bytes and credited figure metadata
        if: steps.save.outputs.published == 'true'
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          base='https://crking92.github.io/Hays-Botany-Asterid-Allies/site/'
          root=Path('site')
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'HaysBotanyLiveSolanumRecovery/1.0'}),timeout=25) as resp:
                  assert resp.status==200
                  return resp.read()
          expected=(root/'data/gallery-index.json').read_bytes()
          for i in range(40):
              try:
                  if fetch('data/gallery-index.json')==expected:break
              except Exception:pass
              time.sleep(10)
          else:raise RuntimeError('Pages gallery index not deployed')
          n=0
          for slug in ('solanum-emulans','solanum-interius'):
              card=json.loads(fetch('data/species/'+slug+'.json'))
              for p in card['verified_photos']:
                  if not p.get('src','').startswith('media/'+slug+'/historical-phytokeys-'):continue
                  assert fetch(p['src'])==(root/p['src']).read_bytes()
                  assert p['license']=='CC BY 4.0' and p['creator'] and p['source_page']
                  n+=1
          assert n==7,n
          print('SOLANUM_RESEARCH_PHOTOS_LIVE_WITH_CREDIT',n)
          PY
