name: Verify existing Asterid-Allies public gallery and site bytes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_existing_site.py'
      - '.github/workflows/verify-existing-site-gallery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check all 118 species and every archived-source photo hash
        run: python3 scripts/verify_existing_site.py
      - name: Confirm live Pages serves every species JSON and published photograph
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Asterid-Allies/site/
